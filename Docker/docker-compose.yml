services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dotnet-base-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Password123"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Password123' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dotnet-base-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "/opt/mssql-tools18/bin/sqlcmd
      -S sqlserver
      -U sa
      -P 'YourStrong!Password123'
      -C
      -Q \"IF DB_ID(N'DotnetBase') IS NULL
      BEGIN
          CREATE DATABASE [DotnetBase];
          PRINT 'Created database DotnetBase';
      END
      ELSE
      BEGIN
          PRINT 'Database DotnetBase already exists';
      END\""

  migrator:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.Migrator
    image: dotnet-base-migrator:latest
    container_name: dotnet-base-migrator
    environment:
      DOTNET_ENVIRONMENT: "Production"
      DB_SERVER: "sqlserver"
      DB_DATABASE: "DotnetBase"
      DB_USERNAME: "sa"
      DB_PASSWORD: "YourStrong!Password123"
    depends_on:
      db-init:
        condition: service_completed_successfully
      sqlserver:
        condition: service_healthy

  server:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.Server
    image: dotnet-base-server:latest
    container_name: dotnet-base-server
    ports:
      - "8080:8080"
    environment:
      DOTNET_ENVIRONMENT: "Production"
      DB_SERVER: "sqlserver"
      DB_DATABASE: "DotnetBase"
      DB_USERNAME: "sa"
      DB_PASSWORD: "YourStrong!Password123"
    depends_on:
      sqlserver:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

volumes:
  sqlserver-data: